  <!-- JAPANESE THEME SWITCHER WIDGET -->
  <div class="fixed top-24 right-4 z-40 theme-switcher-widget p-1.5 flex items-center gap-1">
    <button onclick="setTheme('sakura')" class="px-3 py-1.5 rounded-full text-xs font-bold transition-all hover:scale-105 bg-pink-500/20 text-pink-300">🌸 Sakura</button>
    <button onclick="setTheme('shrine')" class="px-3 py-1.5 rounded-full text-xs font-bold transition-all hover:scale-105 bg-rose-500/20 text-rose-300">⛩️ Shrine</button>
  </div>

  <!-- NAVIGATION BAR -->
  <header class="sticky top-0 z-40 bg-[#0f121d]/90 backdrop-blur-xl border-b-2 border-rose-500/40 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="#" class="flex items-center space-x-3 group">
        <div class="w-12 h-12 rounded-2xl bg-slate-900 border-2 border-rose-400 flex items-center justify-center text-xs group-hover:scale-105 transition-transform shadow-lg shadow-rose-500/30">
          🌸
        </div>
        <div>
          <span class="font-display font-extrabold text-xs sm:text-xs text-rose-20 font-jp">
            日本語クラブ
          </span>
          <span class="block text-[9px] tracking-widest text-amber-100 uppercase font-mono font-bold">Japanese Culinary Memory</span>
        </div>
      </a>

      <!-- Desktop Nav Links -->
      <nav class="hidden lg:flex items-center space-x-6 text-xs font-bold uppercase tracking-wider">
        <a href="#gallery" class="hover:text-rose-300 transition-colors">Galeri Kenangan</a>
        <a href="#members" class="hover:text-rose-300 transition-colors">Anggota Club</a>
        <a href="#timeline" class="hover:text-rose-300 transition-colors">Garis Waktu</a>
        <a href="#omikuji" class="hover:text-rose-300 transition-colors">Ramalan Omikuji</a>
        <a href="#memoryWall" class="hover:text-rose-300 transition-colors">Papan Ema</a>
      </nav>

      <!-- TOP HEADER MUSIC PLAYLIST WIDGET & AUTH CONTROLS -->
      <div class="flex items-center space-x-3 relative">
        
        <!-- PLAYLIST PLAYER WIDGET (PARALLEL TO LOGIN) -->
        <div id="playlistWidget" class="flex items-center gap-2.5 bg-slate-900/90 border border-rose-400/50 rounded-2xl px-3 py-1.5 shadow-lg backdrop-blur-md">
          <button onclick="togglePlayTrack()" id="playlistPlayBtn" class="w-8 h-8 rounded-full bg-rose-600 text-white flex items-center justify-center shadow-md hover:scale-105 transition-transform shrink-0" title="Play / Pause BGM">
            <i data-lucide="play" class="w-4 h-4"></i>
          </button>

          <div class="text-left max-w-[140px] sm:max-w-[190px] overflow-hidden">
            <div class="flex items-center gap-1">
              <span id="playlistTrackTitle" class="text-[11px] font-bold text-white truncate">Memories - Maki Otsuki</span>
            </div>
            <!-- SYNCED MINI KARAOKE LYRICS TICKER -->
            <div id="miniLyricDisplay" class="text-[9px] text-amber-300 font-mono italic truncate">
              🎶 Chiisana koro ni wa takaramono deshita...
            </div>
          </div>

          <!-- Playlist Menu Button -->
          <button onclick="togglePlaylistDropdown()" class="p-1 text-slate-400 hover:text-rose-400 transition-colors shrink-0" title="Pilih Playlist Lagu">
            <i data-lucide="list-music" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- DROPDOWN PLAYLIST DRAWER -->
        <div id="playlistDropdown" class="absolute top-14 right-24 z-50 hidden w-64 bg-slate-900 border-2 border-rose-400 rounded-2xl p-3 shadow-2xl">
          <div class="text-[11px] font-bold text-rose-400 uppercase font-mono mb-2 pb-1 border-b border-slate-800 flex justify-between items-center">
            <span>🎵 Playlist Japanese Club</span>
            <button onclick="togglePlaylistDropdown()" class="text-slate-400 hover:text-white text-xs">✕</button>
          </div>
          <div id="playlistTrackList" class="space-y-1 text-xs">
            <!-- Injected by JS -->
          </div>
        </div>

        <!-- USER LOGIN NAV CONTAINER -->
        <div id="userNavContainer" class="flex items-center gap-2"></div>
      </div>
    </div>
  </header>
