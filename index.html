  <!-- JAPANESE THEME SWITCHER WIDGET (desktop only; mobile version ada di menu hamburger) -->

        <div id="playlistWidget" class="flex items-center gap-2 sm:gap-2.5 bg-slate-900/90 border border-rose-400/50 rounded-2xl px-2.5 sm:px-3 py-1.5 shadow-lg backdrop-blur-md flex-1 lg:flex-none min-w-0">
